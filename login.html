<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in — HandSpeak</title>
  <link rel="stylesheet" href="css/login.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4="
    crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.22.1/jquery.validate.min.js"
    integrity="sha512-qu7dMuIm2f0KcKZ3BOoP4c+Hn+r4E8PbD2Ro4rmKsOyheCxcwhzQpf6SojA76dn+owqfANzfTFUTkGA+HpHjOA=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>

</head>

<body>

  <div class="shell">
    <!-- Story / brand panel -->
    <section class="story-panel" aria-hidden="false">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="20" cy="20" r="19" stroke="#FAF6EF" stroke-width="1.4" />
          <path d="M14 24V13.5C14 12.7 14.7 12 15.5 12C16.3 12 17 12.7 17 13.5V20" stroke="#E2694F" stroke-width="1.8"
            stroke-linecap="round" />
          <path d="M17 20V11.5C17 10.7 17.7 10 18.5 10C19.3 10 20 10.7 20 11.5V20" stroke="#E2694F" stroke-width="1.8"
            stroke-linecap="round" />
          <path d="M20 20V12.5C20 11.7 20.7 11 21.5 11C22.3 11 23 11.7 23 12.5V21" stroke="#E2694F" stroke-width="1.8"
            stroke-linecap="round" />
          <path
            d="M23 21V14.5C23 13.7 23.7 13 24.5 13C25.3 13 26 13.7 26 14.5V24C26 27.3 23.3 30 20 30C17.8 30 16 29 14.6 27.2L11.6 23.4C11.1 22.8 11.2 21.9 11.8 21.4C12.4 21 13.2 21 13.7 21.6L14 22"
            stroke="#E2694F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        HandSpeak
      </div>

      <div class="story-copy">
        <h1>Every hand has a story to tell.</h1>
        <p>Sign back in to pick up your lessons, streaks, and saved fingerspelling drills right where you left off.</p>

      </div>

    </section>

    <!-- Form panel -->
    <section class="form-panel">
      <div class="form-card">
        <header>
          <p class="eyebrow-link">HandSpeak account</p>
          <h2>Welcome back</h2>
          <p class="lede">Log in to continue learning sign language.</p>
        </header>

        <form id="loginForm" action="#" method="post" novalidate>

          <p id="loginMessage" class="login-message" role="alert" style="display:none;"></p>

          <div class="field">
            <label for="login-username">Username</label>
            <div class="input-wrap">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <circle cx="12" cy="8" r="3.4" stroke-width="1.6" />
                <path d="M5 20c0-4 3-6 7-6s7 2 7 6" stroke-width="1.6" />
              </svg>
              <input type="text" id="login-username" name="username" placeholder="Enter your username"
                autocomplete="username" required>
            </div>
          </div>

          <div class="field">
            <label for="login-password">Password</label>
            <div class="input-wrap">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <rect x="5" y="11" width="14" height="9" rx="2" stroke-width="1.6" />
                <path d="M8 11V8a4 4 0 018 0v3" stroke-width="1.6" />
              </svg>
              <input type="password" id="login-password" name="password" placeholder="Enter your password"
                autocomplete="current-password" required>
            </div>
          </div>

          <div class="row-between">
            <label class="checkbox-line">
              <input type="checkbox" name="remember">
              Remember me
            </label>
            <a href="#">Forgot password?</a>
          </div>

          <button type="submit" class="btn-primary">Log in</button>

          <p class="switch-line">New to HandSpeak? <a href="register.html">Create an account</a></p>
        </form>
      </div>
    </section>

  </div>

  <script>
    $(document).ready(function () {

      // Static demo credentials
      var VALID_USERNAME = "admin";
      var VALID_PASSWORD = "12345";

      $("#loginForm").validate({
        errorPlacement: function (error, element) {
          error.insertAfter(element.closest(".input-wrap"));
        },

        rules: {
          username: {
            required: true
          },
          password: {
            required: true
          }
        },

        messages: {
          username: {
            required: "Please enter your username"
          },
          password: {
            required: "Please enter your password"
          }
        },

        submitHandler: function (form) {
          var username = $("#login-username").val().trim();
          var password = $("#login-password").val();
          var $msg = $("#loginMessage");

          if (username === VALID_USERNAME && password === VALID_PASSWORD) {
            $msg
              .removeClass("login-message--error")
              .addClass("login-message--success")
              .text("Login successful! Redirecting…")
              .show();

            // Remember the logged-in user for the landing page
            sessionStorage.setItem("handspeak_username", username);

            setTimeout(function () {
              window.location.href = "landing.html";
            }, 700);
          } else {
            $msg
              .removeClass("login-message--success")
              .addClass("login-message--error")
              .text("Incorrect username or password. Please try again.")
              .show();
          }

          return false;
        }
      });

    });
  </script>

</body>

</html>
